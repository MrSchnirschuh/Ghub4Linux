app-id: com.github.mrschnirschuh.ghub4linux
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: ghub4linux

# NOTE: this manifest has not been built or run.  Flatpak cannot grant access to
# /dev/hidraw* through finish-args at all — the HID node is a device, not a file
# path, so --device=all (the broadest option available) is used.  Treat the
# sandbox as unverified until someone builds it; the regular install.sh path is
# the tested one.
finish-args:
  # Access to display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc

  # Access to the HID devices of Logitech peripherals.  Flatpak exposes devices
  # via --device=all; there is no narrower scope for /dev/hidraw*.
  - --device=all

  # For application profile switching
  - --talk-name=org.freedesktop.portal.Desktop

  # For system tray icon
  - --talk-name=org.kde.StatusNotifierWatcher

  # Access to config directory
  - --filesystem=xdg-config/ghub4linux:create

# Only PyGObject comes from the runtime; the HID layer talks to /dev/hidraw
# directly through the stdlib, so no hidapi and no pydantic module is needed.
modules:
  - name: ghub4linux
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --prefix=${FLATPAK_DEST} .
      - install -Dm644 data/com.github.mrschnirschuh.ghub4linux.desktop ${FLATPAK_DEST}/share/applications/com.github.mrschnirschuh.ghub4linux.desktop
      - install -Dm644 data/com.github.mrschnirschuh.ghub4linux.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.github.mrschnirschuh.ghub4linux.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/com.github.mrschnirschuh.ghub4linux.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/com.github.mrschnirschuh.ghub4linux.svg
    sources:
      - type: dir
        path: ../..
